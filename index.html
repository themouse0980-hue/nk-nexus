<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK Pathshala</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #111111;
      color: #ffffff;
      padding: 20px 14px 40px;
      position: relative;
      overflow-x: hidden;
    }

    /* Peeche Radha-Krishna ki clear transparent watermark photo */
    .bg-watermark {
      position: fixed;
      inset: 0;
      background-image: url("https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/radha-krishna.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0.52;
      filter: contrast(1.06) saturate(1.08);
      pointer-events: none;
      z-index: 0;
    }

    /* Bahut halki shading taaki photo bhi saaf dikhe aur text/logos bhi padhe ja sakein */
    .bg-tint {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(12, 12, 12, 0.22) 0%, rgba(12, 12, 12, 0.45) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .nk-badge {
      width: 58px;
      height: 58px;
      margin: 0 auto 10px;
      border-radius: 14px;
      background: rgba(18, 18, 18, 0.85);
      border: 2px solid #f5b700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: #f5b700;
      box-shadow: 0 0 18px rgba(245, 183, 0, 0.28);
    }

    .header h1 {
      font-size: 22px;
      color: #f5b700;
      margin-bottom: 4px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
    }

    .header p {
      font-size: 11px;
      letter-spacing: 1px;
      color: #f2f2f2;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card {
      text-decoration: none;
      color: #ffffff;
      background: rgba(20, 20, 20, 0.36);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 16px;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(245, 183, 0, 0.75);
      background: rgba(25, 25, 25, 0.5);
    }

    .logo-box {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: rgba(15, 15, 15, 0.88);
      border: 1.5px solid #f5b700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      overflow: hidden;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .platform-name {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body>
  <div class="bg-watermark"></div>
  <div class="bg-tint"></div>

  <div class="container">
    <div class="header">
      <div class="nk-badge">NK</div>
      <h1>Welcome to NK Pathshala</h1>
      <p>Education Must Be Free For Everyone</p>
    </div>

    <div class="grid">
      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/selectionway.png" alt="Selection Way" class="logo-img" />
        </div>
        <span class="platform-name">Selection Way</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/rwa.png" alt="RWA" class="logo-img" />
        </div>
        <span class="platform-name">RWA</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/pw.png" alt="PW" class="logo-img" />
        </div>
        <span class="platform-name">PW</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/kgs.png" alt="KGS" class="logo-img" />
        </div>
        <span class="platform-name">KGS</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/parmar.png" alt="Parmar Academy" class="logo-img" />
        </div>
        <span class="platform-name">Parmar Academy</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/sciencemagnet.png" alt="Science Magnet" class="logo-img" />
        </div>
        <span class="platform-name">Science Magnet</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/vidyagram.png" alt="Vidyagram" class="logo-img" />
        </div>
        <span class="platform-name">Vidyagram</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/yesofficer.png" alt="Yes Officer" class="logo-img" />
        </div>
        <span class="platform-name">Yes Officer</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/missionjeet.png" alt="Mission Jeet" class="logo-img" />
        </div>
        <span class="platform-name">Mission Jeet</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/nexttoppers.png" alt="Next Toppers" class="logo-img" />
        </div>
        <span class="platform-name">Next Toppers</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/eduteria.png" alt="Edu Teria" class="logo-img" />
        </div>
        <span class="platform-name">Edu Teria</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/futurekul.png" alt="Futurekul" class="logo-img" />
        </div>
        <span class="platform-name">Futurekul</span>
      </a>
    </div>
  </div>
</body>
</html>
