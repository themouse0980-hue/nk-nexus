<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK Pathshala</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #111111;
      color: #ffffff;
      padding: 20px 14px 40px;
      position: relative;
      overflow-x: hidden;
    }

    /* Peeche Radha-Krishna ki saaf watermark photo */
    .bg-watermark {
      position: fixed;
      inset: 0;
      background-image: url("https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/radha-krishna.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0.85;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .nk-badge {
      width: 86px;
      height: 86px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: rgba(15, 15, 15, 0.85);
      border: 2px solid #f5b700;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
    }

    .nk-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .header h1 {
      font-size: 22px;
      color: #f5b700;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.85);
    }

    .header p {
      font-size: 11px;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0, 0, 0, 0.9);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .card {
      text-decoration: none;
      color: #ffffff;
      background: transparent;
      border: none;
      border-radius: 16px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .logo-box {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: rgba(15, 15, 15, 0.78);
      border: 1.5px solid #f5b700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .platform-name {
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <div class="bg-watermark"></div>

  <div class="container">
    <div class="header">
      <div class="nk-badge">
        <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/nk-logo.png" alt="NK Pathshala Logo" />
      </div>
      <h1>Welcome to NK Pathshala</h1>
      <p>Education Must Be Free For Everyone</p>
    </div>

    <div class="grid">
      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/selectionway.png" alt="Selection Way" class="logo-img" />
        </div>
        <span class="platform-name">Selection Way</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/rwa.png" alt="RWA" class="logo-img" />
        </div>
        <span class="platform-name">RWA</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/pw.png" alt="PW" class="logo-img" />
        </div>
        <span class="platform-name">PW</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/kgs.png" alt="KGS" class="logo-img" />
        </div>
        <span class="platform-name">KGS</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/parmar.png" alt="Parmar Academy" class="logo-img" />
        </div>
        <span class="platform-name">Parmar Academy</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/sciencemagnet.png" alt="Science Magnet" class="logo-img" />
        </div>
        <span class="platform-name">Science Magnet</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/vidyagram.png" alt="Vidyagram" class="logo-img" />
        </div>
        <span class="platform-name">Vidyagram</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/yesofficer.png" alt="Yes Officer" class="logo-img" />
        </div>
        <span class="platform-name">Yes Officer</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/missionjeet.png" alt="Mission Jeet" class="logo-img" />
        </div>
        <span class="platform-name">Mission Jeet</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/nexttoppers.png" alt="Next Toppers" class="logo-img" />
        </div>
        <span class="platform-name">Next Toppers</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/eduteria.png" alt="Edu Teria" class="logo-img" />
        </div>
        <span class="platform-name">Edu Teria</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/main/futurekul.png" alt="Futurekul" class="logo-img" />
        </div>
        <span class="platform-name">Futurekul</span>
      </a>
    </div>
  </div>
</body>
</html>
