<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK Pathshala</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #3b3b3b, #141414);
      color: #ffffff;
      padding: 20px 14px 40px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .nk-badge {
      width: 58px;
      height: 58px;
      margin: 0 auto 10px;
      border-radius: 14px;
      background: rgba(25, 25, 25, 0.9);
      border: 2px solid #f5b700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      color: #f5b700;
      box-shadow: 0 0 18px rgba(245, 183, 0, 0.25);
    }

    .header h1 {
      font-size: 22px;
      color: #f5b700;
      margin-bottom: 4px;
    }

    .header p {
      font-size: 11px;
      letter-spacing: 1px;
      color: #cfcfcf;
      text-transform: uppercase;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card {
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(245, 183, 0, 0.65);
      background: rgba(255, 255, 255, 0.12);
    }

    .logo-box {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: rgba(15, 15, 15, 0.85);
      border: 1.5px solid #f5b700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      overflow: hidden;
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .platform-name {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      color: #f3f3f3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="nk-badge">NK</div>
      <h1>Welcome to NK Pathshala</h1>
      <p>Education Must Be Free For Everyone</p>
    </div>

    <div class="grid">
      <a href="#" class="card">
        <div class="logo-box">
          <img src="selectionway.png" alt="Selection Way" class="logo-img" />
        </div>
        <span class="platform-name">Selection Way</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="rwa.png" alt="RWA" class="logo-img" />
        </div>
        <span class="platform-name">RWA</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="pw.png" alt="PW" class="logo-img" />
        </div>
        <span class="platform-name">PW</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="kgs.png" alt="KGS" class="logo-img" />
        </div>
        <span class="platform-name">KGS</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="parmar.png" alt="Parmar Academy" class="logo-img" />
        </div>
        <span class="platform-name">Parmar Academy</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="sciencemagnet.png" alt="Science Magnet" class="logo-img" />
        </div>
        <span class="platform-name">Science Magnet</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="vidyagram.png" alt="Vidyagram" class="logo-img" />
        </div>
        <span class="platform-name">Vidyagram</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="yesofficer.png" alt="Yes Officer" class="logo-img" />
        </div>
        <span class="platform-name">Yes Officer</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="missionjeet.png" alt="Mission Jeet" class="logo-img" />
        </div>
        <span class="platform-name">Mission Jeet</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="nexttoppers.png" alt="Next Toppers" class="logo-img" />
        </div>
        <span class="platform-name">Next Toppers</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="eduteria.png" alt="Edu Teria" class="logo-img" />
        </div>
        <span class="platform-name">Edu Teria</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="futurekul.png" alt="Futurekul" class="logo-img" />
        </div>
        <span class="platform-name">Futurekul</span>
      </a>
    </div>
  </div>
</body>
</html>
