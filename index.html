<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NK Pathshala - Study Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            font-size: 24px;
            color: #f1c40f;
            margin-bottom: 5px;
        }
        .header p {
            font-size: 13px;
            color: #b2bec3;
        }
        .telegram-btn {
            background: #1e1e1e;
            border: 1px solid #333;
            color: #fff;
            width: 100%;
            max-width: 400px;
            padding: 12px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .telegram-btn span {
            font-weight: bold;
            font-size: 14px;
        }
        .search-box {
            width: 100%;
            max-width: 400px;
            margin-bottom: 25px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            background: #161616;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .card {
            background: #161616;
            border: 1px solid #2d2d2d;
            border-radius: 16px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .card:active {
            transform: scale(0.95);
            background: #222;
        }
        .card h3 {
            font-size: 13px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>NK Pathshala</h1>
        <p>EDUCATION MUST BE FREE FOR EVERYONE</p>
    </div>

    <!-- Telegram Link -->
    <a href="https://telegram.org" target="_blank" class="telegram-btn">
        <span>📢 Join Our Telegram</span>
        <span>➔</span>
    </a>

    <!-- Search Bar -->
    <div class="search-box">
        <input type="text" placeholder="Search platforms...">
    </div>

    <!-- Batches / Servers Grid -->
    <div class="grid-container">
        <a href="#" class="card">
            <div style="font-size: 24px; margin-bottom: 8px;">📚</div>
            <h3>PW Selection</h3>
        </a>
        <a href="#" class="card">
            <div style="font-size: 24px; margin-bottom: 8px;">📘</div>
            <h3>PW Books</h3>
        </a>
        <a href="#" class="card">
            <div style="font-size: 24px; margin-bottom: 8px;">⚡</div>
            <h3>Next Topper</h3>
        </a>
        <a href="#" class="card">
            <div style="font-size: 24px; margin-bottom: 8px;">🚀</div>
            <h3>Selection Way</h3>
        </a>
    </div>

</body>
</html>
