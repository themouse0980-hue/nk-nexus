<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NK Pathshala</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: #111111;
      color: #ffffff;
      padding: 20px 14px 40px;
      position: relative;
      overflow-x: hidden;
    }

    /* पीछे राधा-कृष्ण की साफ़ वॉटरमार्क फोटो */
    .bg-watermark {
      position: fixed;
      inset: 0;
      background-image: url("https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/radha-krishna.png");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0.85;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .nk-badge {
      width: 86px;
      height: 86px;
      margin: 0 auto 10px;
      border-radius: 50%;
      background: rgba(15, 15, 15, 0.85);
      border: 2px solid #f5b700;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
    }

    .nk-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .header h1 {
      font-size: 22px;
      color: #f5b700;
      margin-bottom: 4px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 6px rgba(0, 0, 0, 0.85);
    }

    .header p {
      font-size: 11px;
      letter-spacing: 1px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0, 0, 0, 0.9);
    }

    /* ऊपर StudyBison स्टाइल Telegram बटन */
    .telegram-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .telegram-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      background: rgba(24, 119, 242, 0.88);
      border: 1.5px solid rgba(255, 255, 255, 0.35);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .telegram-btn:hover {
      transform: translateY(-2px);
      background: rgba(24, 119, 242, 1);
    }

    .telegram-icon {
      width: 16px;
      height: 16px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .card {
      text-decoration: none;
      color: #ffffff;
      background: transparent;
      border: none;
      border-radius: 16px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
    }

    .logo-box {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: rgba(15, 15, 15, 0.78);
      border: 1.5px solid #f5b700;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55);
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .platform-name {
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 6px rgba(0, 0, 0, 0.9);
    }
  </style>
</head>
<body>
  <div class="bg-watermark"></div>

  <div class="container">
    <div class="header">
      <div class="nk-badge">
        <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/nk-logo.png" alt="NK Pathshala Logo" />
      </div>
      <h1>Welcome to NK Pathshala</h1>
      <p>Education Must Be Free For Everyone</p>
    </div>

    <div class="telegram-wrap">
      <a href="https://t.me/+ci3EnMDrgswxMjc1" target="_blank" rel="noopener noreferrer" class="telegram-btn">
        <svg class="telegram-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21.944 4.506a1.5 1.5 0 0 0-1.607-.246L3.168 11.12a1.5 1.5 0 0 0 .14 2.836l3.67 1.18 1.42 4.54a1.5 1.5 0 0 0 2.576.53l2.06-2.25 3.99 2.94a1.5 1.5 0 0 0 2.373-.91l2.62-13.5a1.5 1.5 0 0 0-.071-1.452zM8.32 14.37l9.42-6.58-7.43 8.12-.33 2.82-1.66-4.36z"/>
        </svg>
        <span>Join to Telegram</span>
      </a>
    </div>

    <div class="grid">
      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/selectionway.png" alt="Selection Way" class="logo-img" />
        </div>
        <span class="platform-name">Selection Way</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/rwa.png" alt="RWA" class="logo-img" />
        </div>
        <span class="platform-name">RWA</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/pw.png" alt="PW" class="logo-img" />
        </div>
        <span class="platform-name">PW</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/kgs.png" alt="KGS" class="logo-img" />
        </div>
        <span class="platform-name">KGS</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/parmar.png" alt="Parmar Academy" class="logo-img" />
        </div>
        <span class="platform-name">Parmar Academy</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/sciencemagnet.png" alt="Science Magnet" class="logo-img" />
        </div>
        <span class="platform-name">Science Magnet</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/vidyagram.png" alt="Vidyagram" class="logo-img" />
        </div>
        <span class="platform-name">Vidyagram</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/yesofficer.png" alt="Yes Officer" class="logo-img" />
        </div>
        <span class="platform-name">Yes Officer</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/missionjeet.png" alt="Mission Jeet" class="logo-img" />
        </div>
        <span class="platform-name">Mission Jeet</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/nexttoppers.png" alt="Next Toppers" class="logo-img" />
        </div>
        <span class="platform-name">Next Toppers</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/eduteria.png" alt="Edu Teria" class="logo-img" />
        </div>
        <span class="platform-name">Edu Teria</span>
      </a>

      <a href="#" class="card">
        <div class="logo-box">
          <img src="https://raw.githubusercontent.com/themouse0980-hue/nk-nexus/index.html/futurekul.png" alt="Futurekul" class="logo-img" />
        </div>
        <span class="platform-name">Futurekul</span>
      </a>
    </div>
  </div>
</body>
</html>
